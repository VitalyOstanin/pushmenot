name: Android

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          "${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew --no-daemon --no-build-cache :core:test :app:assembleDebug :app:assembleDebugAndroidTest :fixture:assembleDebug
      - run: ./gradlew --no-daemon --no-build-cache :app:lintDebug

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          "${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew --no-daemon --no-build-cache :app:assembleRelease
      - name: Check the tag and sign the APK
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          version=$(jq -er '.elements | if length == 1 then .[0].versionName else error("expected one APK") end' app/build/outputs/apk/release/output-metadata.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$RELEASE_TAG" == "v$version" ]]
          mkdir -p dist
          tools/sign-apk.sh app/build/outputs/apk/release/app-release-unsigned.apk "dist/push-me-not-$version.apk"
          (cd dist && sha256sum "push-me-not-$version.apk" > SHA256SUMS.txt)
      - name: Upload a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes dist/*.apk dist/SHA256SUMS.txt
